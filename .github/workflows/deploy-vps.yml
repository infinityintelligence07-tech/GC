name: Deploy GC na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gc-main
  cancel-in-progress: false

# Secrets iguais aos do IAM-Control-Frontend / IAM-Control-Backend:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT, VPS_SSH_KEY_PASSPHRASE
# Secrets deste app (mesmos valores do .env.production):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID

jobs:
  deploy:
    name: Build e publicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Empacotar dist
        run: tar -C dist -czf gc-dist.tar.gz .

      # Diagnóstico: mostra no log se a porta SSH da VPS está alcançável a partir
      # do runner ANTES de tentar o scp. "fechada/timeout" com o site no ar =
      # firewall/fail2ban bloqueando o IP do runner ou VPS_HOST/VPS_PORT errados
      # (ex.: host atrás do Cloudflare — o Cloudflare não proxia SSH).
      - name: Diagnóstico de rede (VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "IP público do runner: $(curl -s --max-time 10 https://api.ipify.org || echo '?')"
          echo "Resolução de VPS_HOST: $(getent ahostsv4 "$VPS_HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          if timeout 20 bash -c "</dev/tcp/$VPS_HOST/$VPS_PORT" 2>/dev/null; then
            echo "Porta SSH da VPS: ABERTA"
          else
            echo "::warning::Porta SSH da VPS: FECHADA/TIMEOUT a partir do runner (firewall, fail2ban, VPS fora ou secret VPS_HOST/VPS_PORT incorreto)"
          fi
          echo "Site: HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://gc.iamcontrol.com.br || echo '?')"

      # O runner troca de IP a cada execução e a conexão com a VPS às vezes
      # estoura o timeout padrão de 30s. Uma segunda tentativa evita perder o
      # build inteiro por causa de um soluço de rede.
      - name: Enviar pacote
        id: scp
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          timeout: 120s
          source: gc-dist.tar.gz
          target: /tmp

      - name: Aguardar antes da 2ª tentativa
        if: steps.scp.outcome == 'failure'
        run: sleep 45

      - name: Enviar pacote (2ª tentativa)
        if: steps.scp.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          timeout: 120s
          source: gc-dist.tar.gz
          target: /tmp

      - name: Publicar no Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          timeout: 120s
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            WEBROOT=/var/www/gc.iamcontrol.com.br
            test -f /tmp/gc-dist.tar.gz
            mkdir -p "$WEBROOT"
            find "$WEBROOT" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +
            tar -xzf /tmp/gc-dist.tar.gz -C "$WEBROOT"
            chown -R www-data:www-data "$WEBROOT"
            rm -f /tmp/gc-dist.tar.gz
            test -f "$WEBROOT/index.html"
            echo "[deploy] GC publicado em $WEBROOT"
