# SOMENTE gc.iamcontrol.com.br (HTTPS).
# Não usa default_server. Não altera IAM Control nem IAM Hub.
# Root exclusivo: /var/www/gc.iamcontrol.com.br
# Requer certificado em /etc/letsencrypt/live/gc.iamcontrol.com.br/

server {
    listen 80;
    listen [::]:80;
    server_name gc.iamcontrol.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gc.iamcontrol.com.br;

    ssl_certificate /etc/letsencrypt/live/gc.iamcontrol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gc.iamcontrol.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gc.iamcontrol.com.br;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
